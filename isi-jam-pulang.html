var db=firebase.firestore(),$=function(s){return document.querySelector(s)},plan=[];
function log(t,c){$('#log').innerHTML='<p class="'+(c||'')+'">'+t+'</p>'}

async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('att:'+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
$('#go').onclick=async function(){
  try{
    log('Memuat…');
    var c=await db.doc('config/main').get();if(!c.exists)return log('Data aplikasi tidak ditemukan.','bad');
    var cfg=c.data();
    if(cfg.pin&&(await sha($('#pin').value))!==cfg.pin)return log('PIN salah.','bad');
    var snap=await db.collection('attendance').get(),recs={};
    snap.forEach(function(d){var o=d.data();recs[o.wid+'_'+o.date]=o});
    var ow=$('#ow').checked,miss=[];plan=[];
    DATA.forEach(function(x){

      var old=recs[w.id+'_'+x.d]||{},tin=old.in?t24(old.in):x.i,oldOut=old.out?t24(old.out):x.o;
      var res={n:x.n,d:x.d,i:tin,was:oldOut,wid:w.id,hasIn:!!old.in};
      if(mins(tin)>=mins(OUT)){res.skip='masuk setelah 16:25';}
      else if(oldOut&&!ow&&mins(oldOut)>mins(tin)){res.skip='sudah ada jam pulang';}
      else if(oldOut===OUT){res.skip='sudah 16:25';}
      plan.push(res)});
    var todo=plan.filter(function(p){return!p.skip});
    var h='<table><tr><th>Tanggal</th><th>Nama</th><th>Masuk</th><th>Pulang lama</th><th>Hasil</th></tr>';
    plan.forEach(function(p){h+='<tr><td>'+p.d+'</td><td>'+p.n+'</td><td>'+p.i+'</td><td>'+(p.was||'-')+'</td><td>'+(p.skip?'<span class="mu">lewati ('+p.skip+')</span>':'<b class="ok">→ '+OUT+'</b>')+'</td></tr>'});
    $('#tb').innerHTML=h+'</table>';
    log(todo.length+' catatan akan diisi 16:25.'+(miss.length?' Nama tidak ditemukan di aplikasi: '+miss.join(', ')+'.':''),miss.length?'bad':'ok');

  }catch(e){log('Gagal: '+(e.message||e),'bad')}};
$('#apply').onclick=async function(){
  var b=this;b.disabled=true;var todo=plan.filter(function(p){return!p.skip}),n=0;
  try{
    for(var i=0;i<todo.length;i++){var p=todo[i],o={wid:p.wid,date:p.d,leave:'',out:new Date(p.d+'T'+OUT+':00').getTime(),manual:true};
      if(!p.hasIn)o.in=new Date(p.d+'T'+p.i+':00').getTime();
      await db.doc('attendance/'+p.wid+'_'+p.d).set(o,{merge:true});n++;log('Menyimpan '+n+' / '+todo.length+'…')}
