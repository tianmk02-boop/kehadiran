<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<title>Worker Attendance</title>
<!--
SETUP (shared data across phones):
1. firebase.google.com > create project > Build > Firestore Database > create (test mode).
2. Project settings > Your apps > Web (</>) > copy the firebaseConfig values into FIREBASE_CONFIG below.
3. Upload this file to a GitHub repo, then Settings > Pages > deploy from main branch.
Leave FIREBASE_CONFIG as null for demo mode (data stays on this device only).
-->
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#e3e6ea;--ac:#1f7a5a;--ac2:#fff;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mu:#9aa1ab;--bd:#2d3138;--ac:#3fb98b;--ac2:#08140f;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:680px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:22px;margin:8px 0 14px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.mu{color:var(--mu);font-size:14px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:var(--ac2);font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:8px 12px}
button.x{padding:8px 10px;background:transparent;color:var(--bad);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.big{width:100%;padding:18px;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
.st{margin-top:10px;min-height:22px}.bad,.late{color:var(--bad)}.ok{color:var(--ac)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.r input{flex:1}.r button{flex:none}
hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
#qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}
#qr svg{width:220px;height:220px}
.adm{display:none}body.a .adm{display:block}
</style>
</head>
<body>
<main>
<header><h1>Worker Attendance</h1><button class="s" id="login">Boss login</button></header>
<div id="demo" class="card mu" hidden>Demo mode: data is saved on this device only. Add your Firebase config in the file to share data between phones.</div>
<div class="card">
  <h2>My check-in</h2>
  <label style="margin-top:0">Who are you?</label><select id="who"></select>
  <div class="mu" id="site" style="margin-top:10px"></div>
  <div id="today" style="margin:10px 0"></div>
  <button class="big" id="punch"></button>
  <div class="st" id="st"></div>
</div>
<div class="card adm"><h2>QR code for workers</h2><div id="qr"></div><div class="mu" id="qrl" style="word-break:break-all;margin-top:8px"></div></div>
<div class="card adm"><h2>Workers</h2><div id="wk"></div>
  <div class="row" style="margin-top:12px"><input id="wnm" placeholder="New worker name"><button id="wadd" style="flex:none">Add</button></div><div class="st" id="wst"></div></div>
<div class="card adm"><h2>Work locations</h2><div id="sites"></div><hr>
  <button class="s" id="gps" style="width:100%">📍 Use my current GPS position</button>
  <label>Place name</label><input id="nm" placeholder="e.g. Main site">
  <div class="row"><div><label>Latitude</label><input id="lat" inputmode="decimal"></div><div><label>Longitude</label><input id="lng" inputmode="decimal"></div><div><label>Radius (m)</label><input id="rad" inputmode="numeric" value="100"></div></div>
  <div class="row" style="margin-top:12px"><button id="add">Add location</button></div><hr>
  <label>Late if checked in after</label><input id="lt" type="time" value="09:00" style="max-width:160px"><div class="st" id="sst"></div></div>
<div class="card adm"><h2>Last 7 days</h2><div class="sc" id="tbl"></div><p class="mu">Red = late.</p></div>
<div class="card adm"><h2>Monthly summary</h2><input id="mo" type="month" style="max-width:200px"><div class="sc" id="mtbl" style="margin-top:10px"></div></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
var FIREBASE_CONFIG=null; /* paste your firebaseConfig object here, e.g. {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."} */
(function(){
var $=function(s){return document.querySelector(s)},A,demo=false;
var cfg={sites:[],lateAfter:'09:00',workers:[],pin:''},recs={},sel='',busy=false,isAdmin=false,sig=null,lt=false;
try{sel=localStorage.getItem('wid')||'';isAdmin=sessionStorage.getItem('adm')==='1'}catch(e){}
if(FIREBASE_CONFIG&&window.firebase){
  firebase.initializeApp(FIREBASE_CONFIG);var f=firebase.firestore();
  A={cfg:function(cb){f.doc('config/main').onSnapshot(function(s){cb(s.exists?s.data():null)})},
     recs:function(cb){f.collection('attendance').onSnapshot(function(q){cb(q.docs.map(function(d){return d.data()}))})},
     setCfg:function(o){return f.doc('config/main').set(o)},
     setRec:function(id,o){return f.doc('attendance/'+id).set(o,{merge:true})}};
}else{
  demo=true;var cb={},L=function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
  A={cfg:function(c){cb.c=c;c(L('cfg'))},recs:function(c){cb.r=c;c(Object.values(L('recs')||{}))},
     setCfg:function(o){localStorage.setItem('cfg',JSON.stringify(o));cb.c(o);return Promise.resolve()},
     setRec:function(id,o){var r=L('recs')||{};r[id]=Object.assign({},r[id],o);localStorage.setItem('recs',JSON.stringify(r));cb.r(Object.values(r));return Promise.resolve()}};
  $('#demo').hidden=false;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hm(t){return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function isLate(t){var d=new Date(t),p=cfg.lateAfter.split(':');return d.getHours()*60+d.getMinutes()>(+p[0])*60+(+p[1])}
function hav(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function pos(){return new Promise(function(a,b){if(!navigator.geolocation)return b({message:'GPS is not supported on this device.'});navigator.geolocation.getCurrentPosition(a,b,{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
function st(id,t,c){var e=$(id);e.textContent=t;e.className='st '+(c||'')}
function gerr(e){return e&&e.code===1?'Location permission denied. Please allow location access and try again.':(e&&e.message)||'Could not get your GPS position.'}
function sha(s){if(!window.crypto||!crypto.subtle)return Promise.resolve('p:'+s);return crypto.subtle.digest('SHA-256',new TextEncoder().encode('att:'+s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
function save(id,ok){return A.setCfg(cfg).then(function(){if(id)st(id,ok,'ok')}).catch(function(e){st(id||'#st','Could not save: '+(e.message||e),'bad')})}
function nameOf(id){var w=cfg.workers.filter(function(x){return x.id===id})[0];return w?w.name:'(removed)'}
function cell(r){return r&&r.in?'<span class="'+(isLate(r.in)?'late':'')+'">✓ '+hm(r.in)+'</span>':'–'}

function render(){
  document.body.className=isAdmin?'a':'';$('#login').textContent=isAdmin?'Log out':'Boss login';
  var s2=cfg.workers.map(function(w){return w.id+w.name}).join('|');
  if(s2!==sig){sig=s2;$('#who').innerHTML='<option value="">Choose your name…</option>'+cfg.workers.map(function(w){return'<option value="'+esc(w.id)+'">'+esc(w.name)+'</option>'}).join('')}
  if(!cfg.workers.some(function(w){return w.id===sel}))sel='';
  $('#who').value=sel;
  $('#site').textContent=(cfg.sites.length?'Allowed: '+cfg.sites.map(function(s){return s.name+' ('+s.radius+' m)'}).join(', '):'No work location set yet.')+(cfg.workers.length?'':' No worker names added yet.');
  var d=sel?((recs[sel]||{})[ds(new Date())]||{}):{},t=$('#today'),b=$('#punch');
  if(!sel){t.textContent='Choose your name above.';b.hidden=true}
  else if(d.out){t.textContent='✅ In '+hm(d.in)+(isLate(d.in)?' (late)':'')+' · out '+hm(d.out);b.hidden=true}
  else if(d.in){t.textContent='✅ Checked in at '+hm(d.in)+(isLate(d.in)?' (late)':'');b.hidden=false;b.textContent='Check out';b.dataset.k='out'}
  else{t.textContent='Not checked in today.';b.hidden=false;b.textContent='Check in';b.dataset.k='in'}
  b.disabled=busy||!cfg.sites.length||!sel;
  if(!isAdmin)return;
  if(!lt){lt=true;$('#lt').value=cfg.lateAfter;var u=location.origin+location.pathname;$('#qrl').textContent=u;
    try{var q=qrcode(0,'M');q.addData(u);q.make();$('#qr').innerHTML=q.createSvgTag(6,0)}catch(e){$('#qr').textContent='QR failed to load. Share the link instead.'}}
  $('#sites').innerHTML=cfg.sites.length?cfg.sites.map(function(s,i){return'<div class="r"><span><b>'+esc(s.name)+'</b><br><span class="mu">'+(+s.lat).toFixed(5)+', '+(+s.lng).toFixed(5)+' · '+s.radius+' m</span></span><button class="x" data-i="'+i+'">Remove</button></div>'}).join(''):'<div class="mu">No locations yet.</div>';
  if(!$('#wk').contains(document.activeElement))$('#wk').innerHTML=cfg.workers.length?cfg.workers.map(function(w,i){return'<div class="r"><input data-n="'+i+'" value="'+esc(w.name)+'"><button class="x" data-r="'+i+'">Remove</button></div>'}).join(''):'<div class="mu">No workers yet.</div>';
  var ids=cfg.workers.map(function(w){return w.id});Object.keys(recs).forEach(function(k){if(ids.indexOf(k)<0)ids.push(k)});
  var days=[];for(var i=0;i<7;i++){var x=new Date();x.setDate(x.getDate()-i);days.push(ds(x))}
  var h='<table><tr><th>Worker</th>'+days.map(function(k){return'<th>'+k.slice(5)+'</th>'}).join('')+'</tr>';
  ids.forEach(function(id){h+='<tr><td>'+esc(nameOf(id))+'</td>'+days.map(function(k){return'<td>'+cell((recs[id]||{})[k])+'</td>'}).join('')+'</tr>'});
  $('#tbl').innerHTML=ids.length?h+'</table>':'<span class="mu">No workers yet.</span>';
  var mo=$('#mo').value||ds(new Date()).slice(0,7),m='<table><tr><th>Worker</th><th>Days</th><th>Late</th><th>Hours</th></tr>';
  ids.forEach(function(id){var p=0,l=0,ms=0,R=recs[id]||{};Object.keys(R).forEach(function(k){if(k.slice(0,7)!==mo||!R[k].in)return;p++;if(isLate(R[k].in))l++;if(R[k].out)ms+=R[k].out-R[k].in});
    m+='<tr><td>'+esc(nameOf(id))+'</td><td>'+p+'</td><td class="'+(l?'late':'')+'">'+l+'</td><td>'+(ms/3600000).toFixed(1)+'</td></tr>'});
  $('#mtbl').innerHTML=ids.length?m+'</table>':'<span class="mu">No data yet.</span>';
}

async function punch(){
  var kind=$('#punch').dataset.k,k=ds(new Date()),cur=(recs[sel]||{})[k]||{};
  if(!cfg.sites.length||!sel)return;busy=true;render();st('#st','Getting your GPS position…');
  try{
    var c=(await pos()).coords,best=null;
    cfg.sites.forEach(function(s){var d=hav(c.latitude,c.longitude,s.lat,s.lng);if(!best||d<best.d)best={s:s,d:d}});
    if(best.d>best.s.radius){st('#st','Too far: you are '+Math.round(best.d)+' m from '+best.s.name+' (nearest). Move within '+best.s.radius+' m.','bad');return}
    var o={wid:sel,date:k};
    if(kind==='in'){if(cur.in)return;o.in=Date.now();o.dist=Math.round(best.d);o.site=best.s.name}
    else{if(!cur.in||cur.out)return;o.out=Date.now()}
    await A.setRec(sel+'_'+k,o);st('#st',(kind==='in'?'Checked in at ':'Checked out at ')+best.s.name+'.','ok');
  }catch(e){st('#st',e&&e.code&&typeof e.code==='number'&&e.code<4?gerr(e):'Error: '+(e.message||e),'bad')}
  finally{busy=false;render()}
}

A.cfg(function(d){d=d||{};cfg={sites:d.sites||[],lateAfter:d.lateAfter||'09:00',workers:d.workers||[],pin:d.pin||''};render()});
A.recs(function(a){recs={};a.forEach(function(d){recs[d.wid]=recs[d.wid]||{};recs[d.wid][d.date]=d});render()});
$('#mo').value=ds(new Date()).slice(0,7);$('#mo').onchange=render;
$('#who').onchange=function(){sel=this.value;try{localStorage.setItem('wid',sel)}catch(e){}render()};
$('#punch').onclick=punch;
$('#login').onclick=async function(){
  if(isAdmin){isAdmin=false;try{sessionStorage.removeItem('adm')}catch(e){}return render()}
  var p=prompt(cfg.pin?'Boss PIN:':'Create a boss PIN (you will use it to log in):');if(!p)return;
  var h=await sha(p);
  if(!cfg.pin){cfg.pin=h;await save()}else if(h!==cfg.pin){alert('Wrong PIN');return}
  isAdmin=true;try{sessionStorage.setItem('adm','1')}catch(e){}render();
};
$('#gps').onclick=async function(){st('#sst','Getting GPS position…');
  try{var p=await pos();$('#lat').value=p.coords.latitude.toFixed(6);$('#lng').value=p.coords.longitude.toFixed(6);st('#sst','Filled in (accuracy ±'+Math.round(p.coords.accuracy)+' m). Name it and tap Add.','ok')}catch(e){st('#sst',gerr(e),'bad')}};
$('#add').onclick=function(){
  var lat=parseFloat($('#lat').value),lng=parseFloat($('#lng').value),rad=parseInt($('#rad').value,10),n=$('#nm').value.trim()||'Work site';
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180||!(rad>=10)){st('#sst','Enter a valid latitude, longitude and a radius of at least 10 m.','bad');return}
  cfg.sites=cfg.sites.concat([{name:n,lat:lat,lng:lng,radius:rad}]);$('#nm').value='';save('#sst','Location added.')};
$('#sites').onclick=function(e){var i=e.target.dataset.i;if(i==null)return;cfg.sites=cfg.sites.filter(function(_,j){return j!==+i});save('#sst','Location removed.')};
$('#lt').onchange=function(){if(this.value){cfg.lateAfter=this.value;save('#sst','Late time saved.')}};
$('#wadd').onclick=function(){var n=$('#wnm').value.trim();if(!n)return;
  cfg.workers=cfg.workers.concat([{id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n}]);$('#wnm').value='';save('#wst','Worker added.')};
$('#wk').onclick=function(e){var i=e.target.dataset.r;if(i==null||!confirm('Remove this worker? Past records stay in the tables.'))return;
  cfg.workers=cfg.workers.filter(function(_,j){return j!==+i});save('#wst','Worker removed.')};
$('#wk').onchange=function(e){var i=e.target.dataset.n,v=e.target.value.trim();if(i==null||!v)return;
  cfg.workers=cfg.workers.map(function(w,j){return j===+i?{id:w.id,name:v}:w});save('#wst','Name updated.')};
render();
})();
</script>
</body>
</html>
